    const playSound = (type) => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'buzz') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        }
      } catch (e) {
        console.log("Audio play blocked or unavailable");
      }
    };

            {/* Interactive Discussion Prompts */}
            <div class="bg-slate-950/50 rounded-2xl p-5 border border-slate-800/80">
              <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-comments text-amber-400"></i> 小組交流討論挑戰題（請四位學生輪流發言）：
              </h4>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                {selectedTopic.discussionQuestions.map((q, idx) => (
                  <div 
                    key={idx}
                    onClick={() => { playSound('click'); setActiveChallenge(idx); }}
                    class={`p-4 rounded-xl border cursor-pointer transition flex items-start gap-3 ${
                      activeChallenge === idx
                        ? 'bg-indigo-900/50 border-indigo-500 text-white shadow-lg'
                        : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'
                    }`}
                  >
                    <span class="w-6 h-6 rounded-full bg-indigo-500/30 text-indigo-300 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">
                      Q{idx + 1}
                    </span>
                    <div class="text-sm font-medium leading-snug">{q}</div>
                  </div>
                ))}
              </div>
              {activeChallenge !== null && (
                <div class="mt-4 p-3 rounded-xl bg-indigo-950/60 border border-indigo-800/60 text-xs text-indigo-200 flex items-center gap-2 animate-fadeIn">
                  <i class="fa-solid fa-lightbulb text-amber-400 text-base"></i>
                  <span>提示：討論重點不在於打敗對方，而是學習用神的智慧與謙卑互相理解！</span>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function TouchQuizGame({ courseData, scores, setScores }) {
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [buzzedTeam, setBuzzedTeam] = useState(null); // 'science' | 'faith' | null
      const [selectedOption, setSelectedOption] = useState(null);
      const [showExplanation, setShowExplanation] = useState(false);
      const [timer, setTimer] = useState(15);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      const q = courseData.quizQuestions[currentQIndex];

      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timer > 0) {
          interval = setInterval(() => {
            setTimer((t) => t - 1);
          }, 1000);
        } else if (timer === 0) {
          setIsTimerRunning(false);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timer]);

      const handleBuzz = (team) => {
        if (buzzedTeam || showExplanation) return;
        playSound('buzz');
        setBuzzedTeam(team);
        setTimer(10);
        setIsTimerRunning(true);
      };

      const handleSelectOption = (index) => {
        if (selectedOption !== null || !buzzedTeam) return;
        setSelectedOption(index);
        setIsTimerRunning(false);

        if (index === q.correct) {
          playSound('correct');
          setScores((prev) => ({
            ...prev,
            [buzzedTeam === 'science' ? 'teamScience' : 'teamFaith']:
              prev[buzzedTeam === 'science' ? 'teamScience' : 'teamFaith'] + 100
          }));
        } else {
          playSound('wrong');
        }
        setShowExplanation(true);
      };

      const handleNextQuestion = () => {
        playSound('click');
        setBuzzedTeam(null);
        setSelectedOption(null);
        setShowExplanation(false);
        setTimer(15);
        setIsTimerRunning(false);
        if (currentQIndex < courseData.quizQuestions.length - 1) {
          setCurrentQIndex((prev) => prev + 1);
        } else {
          setCurrentQIndex(0); // Loop or finish
        }
      };

      return (
        <div class="space-y-6 max-w-5xl mx-auto">
          {/* Top Scoreboard */}
          <div class="grid grid-cols-2 gap-4">
            {/* Team Science Score */}
            <div class={`p-4 rounded-2xl border transition ${
              buzzedTeam === 'science' ? 'bg-cyan-900/60 border-cyan-400 glow-cyan scale-[1.02]' : 'bg-slate-900 border-slate-800'
            }`}>
              <div class="flex justify-between items-center">
                <span class="text-xs font-black text-cyan-400 uppercase tracking-widest flex items-center gap-1.5">
                  <i class="fa-solid fa-flask"></i> 科學家組 (學生 1 & 2)
                </span>
                <span class="text-3xl font-black text-cyan-300">{scores.teamScience} <span class="text-xs text-slate-500">PTS</span></span>
              </div>
            </div>

            {/* Team Faith Score */}
            <div class={`p-4 rounded-2xl border transition ${
              buzzedTeam === 'faith' ? 'bg-amber-900/60 border-amber-400 glow-amber scale-[1.02]' : 'bg-slate-900 border-slate-800'
            }`}>
              <div class="flex justify-between items-center">
                <span class="text-xs font-black text-amber-400 uppercase tracking-widest flex items-center gap-1.5">
                  <i class="fa-solid fa-cross"></i> 基督徒組 (學生 3 & 4)
                </span>
                <span class="text-3xl font-black text-amber-300">{scores.teamFaith} <span class="text-xs text-slate-500">PTS</span></span>
              </div>
            </div>
          </div>

          {/* Main Quiz Screen */}
          <div class="bg-slate-900/90 rounded-3xl border border-slate-800 p-6 md:p-8 shadow-2xl relative overflow-hidden">
            {/* Progress Header */}
            <div class="flex justify-between items-center mb-6">
              <span class="text-xs font-bold text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                題目 {currentQIndex + 1} / {courseData.quizQuestions.length}
              </span>

              {buzzedTeam && (
                <div class="text-sm font-bold flex items-center gap-2">
                  <i class="fa-solid fa-stopwatch text-amber-400 animate-spin"></i>
                  <span class="text-slate-300">回答倒數：</span>
                  <span class={`text-xl font-black ${timer <= 3 ? 'text-red-400' : 'text-amber-400'}`}>{timer}s</span>
                </div>
              )}
            </div>

            {/* Question Text */}
            <h3 class="text-xl md:text-2xl font-black text-white leading-relaxed mb-6">
              {q.question}
            </h3>

            {/* BUZZ-IN BUTTONS (If no team buzzed in yet) */}
            {!buzzedTeam && (
              <div class="my-8 py-6 border-y border-slate-800/80">
                <p class="text-center text-sm font-bold text-slate-400 mb-4 animate-bounce">
                  👇 請點擊電子白板下方按鈕搶答！ 👇
                </p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <button
                    onClick={() => handleBuzz('science')}
                    class="py-8 rounded-2xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black text-2xl shadow-xl glow-cyan transform active:scale-95 transition pulse-btn flex flex-col items-center justify-center gap-2"
                  >
                    <i class="fa-solid fa-hand-pointer text-3xl"></i>
                    科學家組 搶答！
                  </button>
                  <button
                    onClick={() => handleBuzz('faith')}
                    class="py-8 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black text-2xl shadow-xl glow-amber transform active:scale-95 transition pulse-btn flex flex-col items-center justify-center gap-2"
                  >
                    <i class="fa-solid fa-hand-pointer text-3xl"></i>
                    基督徒組 搶答！
                  </button>
                </div>
              </div>
            )}

            {/* OPTIONS AREA (Active once buzzed) */}
            {buzzedTeam && (
              <div class="space-y-3 mb-6">
                <div class="p-2 text-xs font-bold text-center rounded-lg bg-slate-800 text-slate-300 mb-2">
                  搶答成功：
                  <span class={`font-black text-sm ml-1 ${buzzedTeam === 'science' ? 'text-cyan-400' : 'text-amber-400'}`}>
                    {buzzedTeam === 'science' ? '科學家組 (學生1&2)' : '基督徒組 (學生3&4)'}
                  </span>
                  ，請點擊螢幕選擇答案：
                </div>
                {q.options.map((option, idx) => {
                  let btnStyle = "bg-slate-950 border-slate-800 text-slate-200 hover:border-slate-700";
                  if (selectedOption !== null) {
                    if (idx === q.correct) {
                      btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-bold glow-emerald";
                    } else if (idx === selectedOption) {
                      btnStyle = "bg-rose-950/80 border-rose-500 text-rose-200 font-bold";
                    } else {
                      btnStyle = "bg-slate-950 opacity-40 border-slate-900";
                    }
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => handleSelectOption(idx)}
                      disabled={selectedOption !== null}
                      class={`w-full p-4 rounded-xl border text-left text-base font-medium transition flex items-center gap-3 ${btnStyle}`}
                    >
                      <span class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold flex-shrink-0">
                        {String.fromCharCode(65 + idx)}
                      </span>
                      <span>{option}</span>
                      {selectedOption !== null && idx === q.correct && (
                        <i class="fa-solid fa-circle-check text-emerald-400 ml-auto text-xl"></i>
                      )}
                      {selectedOption === idx && idx !== q.correct && (
                        <i class="fa-solid fa-circle-xmark text-rose-400 ml-auto text-xl"></i>
                      )}
                    </button>
                  );
                })}
              </div>
            )}

            {/* Explanation & Summary after Answer */}
            {showExplanation && (
              <div class="mt-6 p-5 rounded-2xl bg-slate-950 border border-slate-800 space-y-3 animate-fadeIn">
                <div class="flex items-center gap-2 text-emerald-400 font-bold text-sm">
                  <i class="fa-solid fa-circle-info"></i> 題目解析與思考提示
                </div>
                <p class="text-slate-300 text-sm leading-relaxed">
                  {q.explanation}
                </p>
                <div class="text-xs text-amber-300/90 font-semibold bg-amber-950/40 p-2.5 rounded-lg border border-amber-900/40">
                  💡 {q.teamTip}
                </div>

                <div class="pt-2 flex justify-end">
                  <button
                    onClick={handleNextQuestion}
                    class="px-6 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg flex items-center gap-2 transition transform active:scale-95"
                  >
                    下一題 <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function TeacherSummary({ courseData }) {
      return (
        <div class="max-w-4xl mx-auto space-y-6">
          {/* Main Key Lessons Card */}
          <div class="bg-slate-900/90 rounded-3xl border border-slate-800 p-6 md:p-8 shadow-2xl space-y-6">
            <div class="border-b border-slate-800 pb-4">
              <span class="text-xs font-bold text-purple-400 uppercase tracking-widest">教師總結重點</span>
              <h2 class="text-2xl font-black text-white flex items-center gap-2 mt-1">
                <i class="fa-solid fa-graduation-cap text-purple-400"></i>
                科學與信仰的尊重與和諧
              </h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-2">
                <h3 class="font-bold text-cyan-300 text-base flex items-center gap-2">
                  <i class="fa-solid fa-compass"></i> 不同領域的互補
                </h3>
                <p class="text-xs text-slate-300 leading-relaxed">
                  科學是透過反覆驗證去解釋自然事實，不同時代會有不同局限。信仰則是探討人與神之間的親密關係。
                </p>
              </div>

              <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-2">
                <h3 class="font-bold text-amber-300 text-base flex items-center gap-2">
                  <i class="fa-solid fa-lightbulb"></i> 讚嘆神的智慧
                </h3>
                <p class="text-xs text-slate-300 leading-relaxed">
                  神喜歡人用他所賞賜的智慧了解世界並發出讚嘆，但我們不需因為科學有限就自行創造違背聖經的理論。
                </p>
              </div>
            </div>

            <div class="p-4 rounded-2xl bg-purple-950/40 border border-purple-800/60 space-y-2">
              <h3 class="font-bold text-purple-200 text-base flex items-center gap-2">
                <i class="fa-solid fa-heart-pulse"></i> 對待硬心者的憐憫
              </h3>
              <p class="text-xs text-purple-200/80 leading-relaxed">
                聖靈（禱告說方言）是神存在的實據。許多人不信是因為未曾親身體驗或硬心。我們與他人談道時應持憐憫與謙卑，而非憤怒爭執。
              </p>
            </div>
          </div>

          {/* Guided Prayer Card */}
          <div class="bg-gradient-to-br from-indigo-950/90 to-purple-950/90 rounded-3xl border border-indigo-800/60 p-6 md:p-8 shadow-2xl space-y-4">
            <div class="flex items-center gap-3 border-b border-indigo-800/50 pb-3">
              <div class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-300 flex items-center justify-center font-bold text-lg">
                <i class="fa-solid fa-hands-praying"></i>
              </div>
              <div>
                <h3 class="font-black text-xl text-white">悟性禱告（帶領國中生同心禱告）</h3>
                <p class="text-xs text-indigo-300">奉主耶穌聖名禱告</p>
              </div>
            </div>

            <div class="space-y-3 text-sm text-indigo-100/90 leading-relaxed font-medium bg-slate-950/50 p-5 rounded-2xl border border-indigo-900/50">
              <p>親愛的主耶穌，感謝您賞賜智慧給我們可以去認識、揣摩和分析您所創造的世界。</p>
              <p>主啊，你知道我們常常是憑著眼見在跟隨你。求你能夠給我們更多的信心，並在信仰上有更多的體驗，能在這個有許多似是而非思潮的世界中，站穩腳步，不要隨流失去。</p>
              <p>能更堅定的相信，並用您賞賜的理性來認識您，在科學尚未能充分解釋之時，又能持續地相信。並用謙卑的心態跟無神論者和基督徒溝通。</p>
              <p class="text-right font-black text-indigo-300 text-base">哈利路亞，阿們。</p>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
