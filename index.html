    // 音效產生器 (Web Audio API)
    const playSound = (type) => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'buzz') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'spinTick') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.04);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
            g.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.3);
            o.start(audioCtx.currentTime + idx * 0.08);
            o.stop(audioCtx.currentTime + idx * 0.08 + 0.3);
          });
        }
      } catch (e) {
        console.log("Audio API not allowed or restricted");
      }
    };

    function WheelModal({ students, setStudents, onClose }) {
      const [isSpinning, setIsSpinning] = useState(false);
      const [resultMessage, setResultMessage] = useState("");
      const canvasRef = useRef(null);

      const names = ["牧霖", "采恩", "黃昕", "阿志老師"];
      const colors = ["#06b6d4", "#3b82f6", "#f59e0b", "#8b5cf6"];

      useEffect(() => {
        drawWheel(0);
      }, []);

      const drawWheel = (currentAngle) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const width = canvas.width;
        const height = canvas.height;
        const radius = width / 2 - 10;
        const sliceAngle = (2 * Math.PI) / names.length;

        ctx.clearRect(0, 0, width, height);

        // Draw wheel slices
        names.forEach((name, i) => {
          const startAngle = currentAngle + i * sliceAngle;
          const endAngle = startAngle + sliceAngle;

          ctx.beginPath();
          ctx.moveTo(width / 2, height / 2);
          ctx.arc(width / 2, height / 2, radius, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = colors[i % colors.length];
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#0f172a";
          ctx.stroke();

          // Text labels
          ctx.save();
          ctx.translate(width / 2, height / 2);
          ctx.rotate(startAngle + sliceAngle / 2);
          ctx.textAlign = "right";
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 20px Noto Sans TC, sans-serif";
          ctx.shadowColor = "rgba(0,0,0,0.6)";
          ctx.shadowBlur = 4;
          ctx.fillText(name, radius - 20, 7);
          ctx.restore();
        });

        // Center hub
        ctx.beginPath();
        ctx.arc(width / 2, height / 2, 28, 0, 2 * Math.PI);
        ctx.fillStyle = "#0f172a";
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#fbbf24";
        ctx.stroke();

        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 12px Noto Sans TC, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("PK", width / 2, height / 2 + 4);
      };

      const spinWheel = () => {
        if (isSpinning) return;
        setIsSpinning(true);
        setResultMessage("");
        playSound('click');

        const shuffled = [...names].sort(() => Math.random() - 0.5);
        const scienceMembers = shuffled.slice(0, 2);
        const faithMembers = shuffled.slice(2, 4);

        const totalRotations = 5 + Math.random() * 3;
        const finalAngle = totalRotations * 2 * Math.PI;
        const duration = 3500;
        const startTime = performance.now();

        let lastTickSegment = -1;

        const animate = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          const currentAngle = easeOut * finalAngle;

          drawWheel(currentAngle);

          const sliceAngle = (2 * Math.PI) / names.length;
          const currentSegment = Math.floor((currentAngle % (2 * Math.PI)) / sliceAngle);
          if (currentSegment !== lastTickSegment) {
            playSound('spinTick');
            lastTickSegment = currentSegment;
          }

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            setIsSpinning(false);
            playSound('fanfare');

            const updated = [
              { id: 1, name: scienceMembers[0], team: "science", role: "科學家組" },
              { id: 2, name: scienceMembers[1], team: "science", role: "科學家組" },
              { id: 3, name: faithMembers[0], team: "faith", role: "基督徒組" },

          }
        };

        requestAnimationFrame(animate);
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-lg w-full text-center space-y-6 shadow-2xl relative animate-fadeIn">

    function TouchQuizGame({ courseData, scores, setScores, students }) {
      const [currentQIndex, setCurrentQIndex] = useState(0);

      const [showExplanation, setShowExplanation] = useState(false);
      const [timer, setTimer] = useState(15);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      const scienceStudents = students ? students.filter(s => s.team === 'science').map(s => s.name).join('、') : '';
      const faithStudents = students ? students.filter(s => s.team === 'faith').map(s => s.name).join('、') : '';

      const q = courseData.quizQuestions[currentQIndex];

      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timer > 0) {
          interval = setInterval(() => {
            setTimer((t) => t - 1);
          }, 1000);
        } else if (timer === 0) {
          setIsTimerRunning(false);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timer]);

      const handleBuzz = (team) => {
        if (buzzedTeam || showExplanation) return;
        playSound('buzz');
        setBuzzedTeam(team);
        setTimer(10);
        setIsTimerRunning(true);
      };

      const handleSelectOption = (index) => {
        if (selectedOption !== null || !buzzedTeam) return;
        setSelectedOption(index);
        setIsTimerRunning(false);

        if (index === q.correct) {
          playSound('correct');
          setScores((prev) => ({
            ...prev,
            [buzzedTeam === 'science' ? 'teamScience' : 'teamFaith']:
              prev[buzzedTeam === 'science' ? 'teamScience' : 'teamFaith'] + 100
          }));
        } else {
          playSound('wrong');
        }
        setShowExplanation(true);
      };

      const handleNextQuestion = () => {
        playSound('click');
        setBuzzedTeam(null);
        setSelectedOption(null);
        setShowExplanation(false);
        setTimer(15);
        setIsTimerRunning(false);
        if (currentQIndex < courseData.quizQuestions.length - 1) {
          setCurrentQIndex((prev) => prev + 1);
        } else {
          setCurrentQIndex(0);
        }
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">

                  if (selectedOption !== null) {
                    if (idx === q.correct) {
                      btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-bold glow-emerald";

                      btnStyle = "bg-rose-950/80 border-rose-500 text-rose-200 font-bold";
